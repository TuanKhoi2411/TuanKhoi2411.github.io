<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portuguese Bank Marketing Dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#111928;font-family:Arial,sans-serif}.tabs{position:sticky;top:0;z-index:2;display:flex;gap:6px;padding:12px;background:#111928}.tabs button{border:1px solid #526078;background:#243148;color:#fff;padding:11px 15px;font-weight:700;cursor:pointer}.tabs button[aria-selected=true]{background:#c7f436;color:#111928;border-color:#c7f436}.stage{min-height:calc(100vh - 62px);display:grid;place-items:center;padding:16px}.stage img{display:none;width:min(100%,1600px);height:auto;box-shadow:0 12px 32px #1119282a}.stage img.active{display:block}@media(max-width:700px){.tabs{overflow:auto}.tabs button{white-space:nowrap;padding:9px}.stage{padding:5px}}</style></head><body><nav class="tabs" aria-label="Dashboard pages"><button aria-selected="true" data-page="0">01 Overview</button><button aria-selected="false" data-page="1">02 Benchmark</button><button aria-selected="false" data-page="2">03 Campaign</button></nav><main class="stage"><img class="active" src="/assets/cases/power-bi/native/marketing-overview.png" alt="Portuguese Bank Marketing Dashboard — Overview"><img src="/assets/cases/power-bi/native/marketing-benchmark.png" alt="Portuguese Bank Marketing Dashboard — Benchmark"><img src="/assets/cases/power-bi/native/marketing-campaign.png" alt="Portuguese Bank Marketing Dashboard — Campaign"></main><script>const b=[...document.querySelectorAll('button')],i=[...document.querySelectorAll('.stage img')];b.forEach((x,n)=>x.onclick=()=>{b.forEach((y,k)=>y.setAttribute('aria-selected',k===n));i.forEach((y,k)=>y.classList.toggle('active',k===n))})</script></body></html>
